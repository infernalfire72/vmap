[package]
name = "vmap-mcp"
description = "MCP server: lets an agent look at maps and assets through tool calls."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vmap-formats.workspace = true
vmap-fs.workspace = true
vmap-world.workspace = true
vmap-render.workspace = true
anyhow.workspace = true
glam.workspace = true
# JPEG for pictures that would be too large to send as PNG.
image = { workspace = true, features = ["jpeg"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
# Keys are kept in the order they are written, which is the order worth reading.
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
base64 = "0.23"
